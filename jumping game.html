<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pixel Rainbow Unicorn Parkour</title>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    margin: 0;
    padding: 0;
  }
  body {
    background: #11141a;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #game-container {
    position: relative;
    border: 4px solid #3c3c3c;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(255, 105, 180, 0.2);
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #68a0ed;
  }
  /* Mobile touch controls overlay */
  .touch-controls {
    display: none;
    position: absolute;
    bottom: 12px;
    left: 0;
    right: 0;
    justify-content: space-between;
    padding: 0 20px;
    pointer-events: none;
  }
  .touch-btn {
    pointer-events: auto;
    width: 65px;
    height: 65px;
    background: rgba(0, 0, 0, 0.45);
    border: 3px solid #ffffff;
    color: #fff;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    touch-action: manipulation;
  }
  .touch-btn:active {
    background: rgba(255, 105, 180, 0.6);
  }
  @media (max-width: 600px) {
    .touch-controls {
      display: flex;
    }
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="380" height="600"></canvas>
  <div class="touch-controls">
    <div class="touch-btn" id="btn-left">◀</div>
    <div class="touch-btn" id="btn-right">▶</div>
  </div>
</div>

<script>
// --- CHIPTUNE AUDIO SYNTHESIS (Zero external assets needed) ---
class SoundController {
  constructor() {
    this.ctx = null;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  playJump() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(260, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(620, this.ctx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.12);
  }
  playSlime() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(320, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(950, this.ctx.currentTime + 0.22);
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.22);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.22);
  }
  playGem() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(659.25, this.ctx.currentTime); // E5
    osc.frequency.setValueAtTime(987.77, this.ctx.currentTime + 0.08); // B5
    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.25);
  }
  playTnt() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(140, this.ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(30, this.ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.15);
  }
  playGameOver() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(280, this.ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(70, this.ctx.currentTime + 0.45);
    gain.gain.setValueAtTime(0.16, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.45);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.45);
  }
}

const sfx = new SoundController();

// --- GAME SETUP ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

const RAINBOW_PALETTE = ['#FF2B56', '#FFA424', '#FFEE32', '#2BE868', '#2BE8F0', '#C25BFF'];

// --- PLAYER (MINECRAFT STYLE UNICORN) ---
const player = {
  x: W / 2 - 15,
  y: H - 120,
  w: 32,
  h: 30,
  vx: 0,
  vy: 0,
  facing: 1, // 1: right, -1: left
  jumpForce: -11.5,
  gravity: 0.38,
  alive: true
};

let keys = { left: false, right: false };
let platforms = [];
let particles = [];
let sparkles = [];
let gems = [];
let clouds = [];

let score = 0;
let highestY = player.y;
let highScore = localStorage.getItem('blocky_unicorn_hs') || 0;
let gameState = 'START'; // 'START', 'PLAYING', 'GAMEOVER'
let cameraY = 0;
let tick = 0;

// Initialize pixel clouds
for (let i = 0; i < 5; i++) {
  clouds.push({
    x: Math.random() * W,
    y: Math.random() * H,
    w: 50 + Math.random() * 40,
    speed: 0.15 + Math.random() * 0.25
  });
}

// --- PLATFORM TYPES ---
// normal: classic grass block
// slime: high jump green block
// moving: diamond block moving horizontally
// tnt: crumbling explosive block
function createPlatform(x, y, type = 'normal') {
  return {
    x: x,
    y: y,
    w: 64,
    h: 16,
    type: type,
    vx: type === 'moving' ? (Math.random() < 0.5 ? 1.5 : -1.5) : 0,
    cracked: false,
    crackTimer: 0
  };
}

function initGame() {
  player.x = W / 2 - 16;
  player.y = H - 140;
  player.vx = 0;
  player.vy = player.jumpForce;
  player.alive = true;
  player.facing = 1;

  cameraY = 0;
  score = 0;
  highestY = player.y;
  platforms = [];
  particles = [];
  sparkles = [];
  gems = [];

  // Starting stable base
  platforms.push(createPlatform(W / 2 - 32, H - 70, 'normal'));
  platforms.push(createPlatform(W / 2 - 100, H - 160, 'normal'));
  platforms.push(createPlatform(W / 2 + 30, H - 240, 'normal'));

  // Generate initial tower of platforms
  let curY = H - 240;
  while (curY > 0) {
    curY -= 65 + Math.random() * 25;
    spawnPlatformAt(curY);
  }
}

function spawnPlatformAt(y) {
  const x = Math.random() * (W - 74) + 5;
  const rand = Math.random();
  let type = 'normal';

  if (rand < 0.18) type = 'slime';
  else if (rand < 0.38) type = 'moving';
  else if (rand < 0.50) type = 'tnt';

  platforms.push(createPlatform(x, y, type));

  // Chance to spawn a pixel diamond/emerald above platform
  if (type !== 'tnt' && Math.random() < 0.28) {
    gems.push({
      x: x + 24,
      y: y - 26,
      w: 14,
      h: 14,
      collected: false,
      bobOffset: Math.random() * Math.PI * 2
    });
  }
}

// --- INPUT LISTENERS ---
window.addEventListener('keydown', (e) => {
  sfx.init();
  if (e.code === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
  if (e.code === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;

  if (gameState !== 'PLAYING') {
    if (e.code === 'Space' || e.key === 'Enter') {
      initGame();
      gameState = 'PLAYING';
    }
  }
});

window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.code === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
});

// Mobile button listeners
const btnL = document.getElementById('btn-left');
const btnR = document.getElementById('btn-right');

const handleTouchStart = (dir) => (e) => {
  e.preventDefault();
  sfx.init();
  if (gameState !== 'PLAYING') {
    initGame();
    gameState = 'PLAYING';
    return;
  }
  keys[dir] = true;
};
const handleTouchEnd = (dir) => (e) => {
  e.preventDefault();
  keys[dir] = false;
};

btnL.addEventListener('touchstart', handleTouchStart('left'));
btnL.addEventListener('touchend', handleTouchEnd('left'));
btnR.addEventListener('touchstart', handleTouchStart('right'));
btnR.addEventListener('touchend', handleTouchEnd('right'));

canvas.addEventListener('click', () => {
  sfx.init();
  if (gameState !== 'PLAYING') {
    initGame();
    gameState = 'PLAYING';
  }
});

// --- DRAWING MINECRAFT-STYLE PIXEL GRAPHICS ---

// Draw Pixel Grass / TNT / Slime / Diamond Platform
function drawMinecraftBlock(p) {
  const x = Math.round(p.x);
  const y = Math.round(p.y - cameraY);
  const w = p.w;
  const h = p.h;

  if (p.type === 'normal') {
    // Dirt base
    ctx.fillStyle = '#866043';
    ctx.fillRect(x, y, w, h);
    // Dark dirt spots
    ctx.fillStyle = '#573d26';
    ctx.fillRect(x + 8, y + 8, 4, 4);
    ctx.fillRect(x + 24, y + 10, 4, 4);
    ctx.fillRect(x + 44, y + 7, 4, 4);

    // Lush Pixel Grass Top
    ctx.fillStyle = '#5c8e32';
    ctx.fillRect(x, y, w, 5);
    // Grass hanging pixel fringes
    ctx.fillRect(x + 4, y + 5, 4, 3);
    ctx.fillRect(x + 16, y + 5, 5, 4);
    ctx.fillRect(x + 30, y + 5, 4, 2);
    ctx.fillRect(x + 42, y + 5, 6, 4);
    ctx.fillRect(x + 54, y + 5, 4, 3);
    ctx.fillStyle = '#72aa3c';
    ctx.fillRect(x, y, w, 2); // Highlight
  } else if (p.type === 'slime') {
    // Bouncy Slime Block
    ctx.fillStyle = '#64a737';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#7bcc3f';
    ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
    // Translucent inner core
    ctx.fillStyle = '#a1f257';
    ctx.fillRect(x + 16, y + 4, w - 32, h - 8);
  } else if (p.type === 'moving') {
    // Diamond Ore Platform
    ctx.fillStyle = '#7a7a7a';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#5e5e5e';
    ctx.fillRect(x + 2, y + 2, 4, 4);
    ctx.fillRect(x + 20, y + 8, 4, 4);
    ctx.fillRect(x + 46, y + 4, 4, 4);
    // Glowing Diamond Flecks
    ctx.fillStyle = '#2ce8d5';
    ctx.fillRect(x + 8, y + 4, 5, 5);
    ctx.fillRect(x + 32, y + 6, 6, 4);
    ctx.fillRect(x + 50, y + 3, 5, 4);
    ctx.fillStyle = '#a6fffa';
    ctx.fillRect(x + 9, y + 5, 2, 2);
    ctx.fillRect(x + 33, y + 7, 2, 2);
  } else if (p.type === 'tnt') {
    // TNT Hazard Platform
    ctx.fillStyle = p.cracked && Math.floor(tick / 4) % 2 === 0 ? '#ffffff' : '#db3923';
    ctx.fillRect(x, y, w, h);
    // TNT White Center Ribbon
    ctx.fillStyle = '#f0efeb';
    ctx.fillRect(x, y + 4, w, 7);
    // Black TNT Text Marks
    ctx.fillStyle = '#111';
    ctx.font = 'bold 8px monospace';
    ctx.fillText('TNT', x + 24, y + 10);
  }

  // Pixel black outline
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}

// Draw Pixelated Collectible Diamond Gem
function drawGem(g) {
  if (g.collected) return;
  const bob = Math.sin(tick * 0.08 + g.bobOffset) * 3;
  const x = Math.round(g.x);
  const y = Math.round(g.y - cameraY + bob);

  // Diamond Gem Shape (isometric pixel block)
  ctx.fillStyle = '#00ffff';
  ctx.fillRect(x + 3, y, 8, 14);
  ctx.fillRect(x, y + 3, 14, 8);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(x + 4, y + 3, 3, 3);
  ctx.fillStyle = '#00a8aa';
  ctx.fillRect(x + 7, y + 8, 4, 4);
}

// Draw The Rainbow Minecraft-Style Unicorn Character
function drawUnicorn(p) {
  ctx.save();
  const screenX = Math.round(p.x + p.w / 2);
  const screenY = Math.round(p.y - cameraY + p.h / 2);

  ctx.translate(screenX, screenY);
  if (p.facing === -1) {
    ctx.scale(-1, 1);
  }

  const ox = -16;
  const oy = -15;

  // --- LEGS (Voxel Hooves) ---
  const legOffset = Math.sin(tick * 0.3) * 2;
  // Back Legs
  ctx.fillStyle = '#d5dbdb';
  ctx.fillRect(ox + 4, oy + 20, 5, 10);
  ctx.fillRect(ox + 20, oy + 20, 5, 10);
  // Gold Hooves
  ctx.fillStyle = '#f7b731';
  ctx.fillRect(ox + 4, oy + 27, 5, 3);
  ctx.fillRect(ox + 20, oy + 27, 5, 3);

  // Front Animated Legs
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(ox + 7, oy + 20 + legOffset, 5, 10);
  ctx.fillRect(ox + 23, oy + 20 - legOffset, 5, 10);
  ctx.fillStyle = '#ffd32a';
  ctx.fillRect(ox + 7, oy + 27 + legOffset, 5, 3);
  ctx.fillRect(ox + 23, oy + 27 - legOffset, 5, 3);

  // --- BODY (Minecraft White Horse Style Block) ---
  ctx.fillStyle = '#f5f6fa';
  ctx.fillRect(ox + 2, oy + 10, 25, 12);
  // Shading on flank
  ctx.fillStyle = '#dcdde1';
  ctx.fillRect(ox + 2, oy + 18, 25, 4);

  // --- RAINBOW TAIL ---
  const tailSway = Math.sin(tick * 0.2) * 3;
  RAINBOW_PALETTE.forEach((color, i) => {
    ctx.fillStyle = color;
    ctx.fillRect(ox - 3 - i * 1.5, oy + 10 + i * 2 + tailSway, 4, 3);
  });

  // --- NECK & HEAD ---
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(ox + 18, oy + 4, 8, 10); // Neck
  ctx.fillRect(ox + 17, oy - 4, 15, 10); // Head Block

  // Muzzle/Snout
  ctx.fillStyle = '#ffc2cd';
  ctx.fillRect(ox + 27, oy + 1, 5, 5);
  ctx.fillStyle = '#2f3542';
  ctx.fillRect(ox + 29, oy + 2, 2, 2); // Nostril

  // Unicorn Eye (Minecraft oversized cute pixel eye)
  ctx.fillStyle = '#2f3542';
  ctx.fillRect(ox + 24, oy - 2, 3, 4);
  ctx.fillStyle = '#70a1ff';
  ctx.fillRect(ox + 24, oy - 2, 3, 2); // Blue iris
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(ox + 24, oy - 2, 1, 2); // Eye catchlight

  // Cute Ears
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(ox + 18, oy - 8, 3, 4);
  ctx.fillStyle = '#ffb8b8';
  ctx.fillRect(ox + 19, oy - 6, 1, 2);

  // --- FLOWING RAINBOW MANE ---
  RAINBOW_PALETTE.forEach((color, i) => {
    ctx.fillStyle = color;
    const wave = Math.sin(tick * 0.25 - i) * 2;
    ctx.fillRect(ox + 14 - i * 2, oy - 3 + i * 2.4, 4, 4 + wave);
  });

  // --- GOLDEN MAGICAL HORN ---
  ctx.fillStyle = '#ffe033';
  ctx.fillRect(ox + 25, oy - 8, 4, 4);
  ctx.fillRect(ox + 27, oy - 12, 3, 4);
  ctx.fillStyle = '#fff48f';
  ctx.fillRect(ox + 28, oy - 14, 2, 3); // Sharp tip

  ctx.restore();
}

// Particle spawner for rainbow trail & jump bursts
function spawnRainbowTrail(x, y, count = 2) {
  for (let i = 0; i < count; i++) {
    const col = RAINBOW_PALETTE[Math.floor(Math.random() * RAINBOW_PALETTE.length)];
    particles.push({
      x: x + (Math.random() - 0.5) * 16,
      y: y + Math.random() * 8,
      vx: (Math.random() - 0.5) * 1.5,
      vy: Math.random() * 1.8 + 0.5,
      size: Math.random() * 4 + 3,
      color: col,
      alpha: 1.0,
      life: 25 + Math.random() * 15
    });
  }
}

function spawnSparkles(x, y, count = 8, color = '#ffeaa7') {
  for (let i = 0; i < count; i++) {
    sparkles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4,
      size: Math.random() * 3 + 2,
      color: color,
      alpha: 1.0,
      life: 20 + Math.random() * 10
    });
  }
}

// --- UPDATE & GAME LOOP ---
function update() {
  tick++;

  // Update background pixel clouds
  clouds.forEach(c => {
    c.x += c.speed;
    if (c.x > W + 50) c.x = -100;
  });

  if (gameState !== 'PLAYING') return;

  // Horizontal Movement
  if (keys.left) {
    player.vx = -4.5;
    player.facing = -1;
  } else if (keys.right) {
    player.vx = 4.5;
    player.facing = 1;
  } else {
    player.vx *= 0.82;
  }

  player.x += player.vx;
  player.vy += player.gravity;
  player.y += player.vy;

  // Rainbow trail from unicorn
  if (player.vy < 0 || Math.abs(player.vx) > 1) {
    spawnRainbowTrail(player.x + player.w / 2 - (player.facing * 10), player.y + player.h - 4, 1);
  }

  // Screen wrap-around horizontal
  if (player.x < -player.w) player.x = W;
  if (player.x > W) player.x = -player.w;

  // Platform collisions (only when moving downwards)
  if (player.vy > 0) {
    platforms.forEach(p => {
      // Bounding box foot-hit test
      if (
        player.x + player.w * 0.75 > p.x &&
        player.x + player.w * 0.25 < p.x + p.w &&
        player.y + player.h >= p.y &&
        player.y + player.h <= p.y + 14
      ) {
        if (p.type === 'slime') {
          player.vy = player.jumpForce * 1.55; // Super spring bounce
          sfx.playSlime();
          spawnSparkles(player.x + player.w / 2, p.y, 14, '#76ff03');
        } else if (p.type === 'tnt') {
          if (!p.cracked) {
            p.cracked = true;
            sfx.playTnt();
          }
          player.vy = player.jumpForce;
          spawnSparkles(player.x + player.w / 2, p.y, 10, '#ff3838');
        } else {
          // Standard bounce
          player.vy = player.jumpForce;
          sfx.playJump();
          spawnSparkles(player.x + player.w / 2, p.y, 8, '#ffffff');
        }
      }
    });
  }

  // Platform updates (moving, TNT crack)
  for (let i = platforms.length - 1; i >= 0; i--) {
    const p = platforms[i];
    if (p.type === 'moving') {
      p.x += p.vx;
      if (p.x < 0 || p.x + p.w > W) p.vx *= -1;
    } else if (p.type === 'tnt' && p.cracked) {
      p.crackTimer++;
      if (p.crackTimer > 15) {
        // Platform explodes and disappears!
        spawnSparkles(p.x + p.w / 2, p.y + p.h / 2, 20, '#ff5722');
        platforms.splice(i, 1);
        continue;
      }
    }
  }

  // Gem collection
  gems.forEach(g => {
    if (!g.collected) {
      if (
        player.x + player.w > g.x &&
        player.x < g.x + g.w &&
        player.y + player.h > g.y &&
        player.y < g.y + g.h
      ) {
        g.collected = true;
        score += 250;
        sfx.playGem();
        spawnSparkles(g.x + 7, g.y + 7, 18, '#00ffff');
        player.vy = player.jumpForce * 1.15; // Little boost from diamond
      }
    }
  });

  // Camera follows highest ascent
  if (player.y < highestY) {
    highestY = player.y;
    score += Math.round((highestY - player.y) * 2);
  }

  const targetCameraY = player.y - H * 0.55;
  if (targetCameraY < cameraY) {
    cameraY += (targetCameraY - cameraY) * 0.12;
  }

  // Update Score based on elevation
  const currentHeightScore = Math.max(0, Math.floor((H - 140 - player.y)));
  if (currentHeightScore > score) {
    score = currentHeightScore;
  }

  // Recycle / spawn new platforms as camera scrolls
  while (platforms.length > 0 && platforms[0].y - cameraY > H + 40) {
    platforms.shift();
  }

  const highestPlatformY = platforms.reduce((min, p) => Math.min(min, p.y), Infinity);
  if (highestPlatformY - cameraY > -50) {
    spawnPlatformAt(highestPlatformY - (55 + Math.random() * 30));
  }

  // Remove collected or off-screen gems
  gems = gems.filter(g => !g.collected && (g.y - cameraY < H + 60));

  // Update Particles
  particles.forEach(pt => {
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.alpha -= 1 / pt.life;
  });
  particles = particles.filter(pt => pt.alpha > 0);

  sparkles.forEach(sp => {
    sp.x += sp.vx;
    sp.y += sp.vy;
    sp.alpha -= 1 / sp.life;
  });
  sparkles = sparkles.filter(sp => sp.alpha > 0);

  // Check Game Over (fell below the bottom of the screen)
  if (player.y - cameraY > H + 50) {
    gameState = 'GAMEOVER';
    sfx.playGameOver();
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('blocky_unicorn_hs', highScore);
    }
  }
}

// --- RENDER ---
function draw() {
  // Clear sky with gradient
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, '#4a89dc');
  skyGrad.addColorStop(1, '#9ad0f5');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  // Draw Blocky Clouds
  clouds.forEach(c => {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
    ctx.fillRect(Math.round(c.x), Math.round(c.y), Math.round(c.w), 16);
    ctx.fillRect(Math.round(c.x + 8), Math.round(c.y - 8), Math.round(c.w - 18), 8);
  });

  // Platforms
  platforms.forEach(drawMinecraftBlock);

  // Gems
  gems.forEach(drawGem);

  // Particles
  particles.forEach(pt => {
    ctx.fillStyle = pt.color;
    ctx.globalAlpha = Math.max(0, pt.alpha);
    ctx.fillRect(Math.round(pt.x), Math.round(pt.y - cameraY), Math.round(pt.size), Math.round(pt.size));
  });

  // Sparkles
  sparkles.forEach(sp => {
    ctx.fillStyle = sp.color;
    ctx.globalAlpha = Math.max(0, sp.alpha);
    ctx.fillRect(Math.round(sp.x), Math.round(sp.y - cameraY), Math.round(sp.size), Math.round(sp.size));
  });
  ctx.globalAlpha = 1.0;

  // Unicorn
  if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
    drawUnicorn(player);
  }

  // --- MINECRAFT STYLE HUD ---
  ctx.fillStyle = '#000000';
  ctx.font = 'bold 16px "Courier New", monospace';
  ctx.fillText(`SCORE: ${score}`, 16, 28);
  ctx.fillStyle = '#f5cd79';
  ctx.fillText(`BEST:  ${highScore}`, 16, 48);

  // UI OVERLAYS
  if (gameState === 'START') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.fillRect(0, 0, W, H);

    // Title Banner
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 22px "Courier New", monospace';
    ctx.fillText('RAINBOW UNICORN', W / 2, H / 2 - 90);
    ctx.fillStyle = '#ff7675';
    ctx.fillText('BLOCK PARKOUR', W / 2, H / 2 - 65);

    // Demo Unicorn in center
    drawUnicorn({ x: W / 2 - 16, y: H / 2 - 20, w: 32, h: 30, facing: 1 });

    ctx.fillStyle = '#f1c40f';
    ctx.font = '14px monospace';
    ctx.fillText('Bounce high on Minecraft blocks!', W / 2, H / 2 + 50);

    ctx.fillStyle = '#ffffff';
    ctx.font = '12px monospace';
    ctx.fillText('Green = Slime Launch | Red = TNT Break', W / 2, H / 2 + 75);

    ctx.fillStyle = '#55efc4';
    ctx.font = 'bold 16px monospace';
    ctx.fillText('PRESS SPACE OR TAP TO PLAY', W / 2, H / 2 + 120);
    ctx.textAlign = 'start';
  } else if (gameState === 'GAMEOVER') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#e74c3c';
    ctx.textAlign = 'center';
    ctx.font = 'bold 28px "Courier New", monospace';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 50);

    ctx.fillStyle = '#ffffff';
    ctx.font = '18px monospace';
    ctx.fillText(`FINAL SCORE: ${score}`, W / 2, H / 2 - 10);
    ctx.fillStyle = '#f1c40f';
    ctx.fillText(`HIGH SCORE: ${highScore}`, W / 2, H / 2 + 20);

    ctx.fillStyle = '#74b9ff';
    ctx.font = 'bold 15px monospace';
    ctx.fillText('PRESS SPACE OR TAP TO RETRY', W / 2, H / 2 + 80);
    ctx.textAlign = 'start';
  }
}

// --- GAME LOOP ---
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
